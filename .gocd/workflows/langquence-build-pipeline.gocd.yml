format_version: 10

pipelines:
  langquence-build-pipeline:
    group: defaultGroup
    display_order: 10
    lock_template: ${COUNT}
    lock_behavior: none
    materials:
      git:
        git: https://github.com/Langquence/langquence-was.git
        branch: feat/apply-gocd-pipeline # for testing
    stages:
      - build:
          clean_workspace: true
          jobs:
            setUp:
              tasks: ## 현재 존재하는 langquence-was-dev 컨테이너를 삭제하고 새로 생성
                - exec:
                    command: docker
                    arguments:
                      - rm
                      - -f
                      - langquence-was
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - cp /home/go/.env .env
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - cat .env
                - exec:
                    command: docker
                    arguments:
                      - build
                      - -t
                      - langquence-was:local
                      - .
                - exec:
                    command: docker
                    arguments:
                      - run
                      - -d
                      - --name
                      - langquence-was-dev
                      - -p
                      - 8090:8090
                      - --env-file
                      - .env
                      - langquence-was:local