format_version: 10

pipelines:
  langquence-dev-deploy-pipeline:
    group: defaultGroup
    display_order: 10
    lock_template: ${COUNT}
    lock_behavior: none
    materials:
      git:
        git: https://github.com/Langquence/langquence-was.git
        branch: feat/add-sdk-generate-pipeline
    stages:
      - deploy:
          clean_workspace: true
          jobs:
            setUp:
              tasks:
                - exec:
                    command: echo
                    arguments:
                      - {{SECRET:[github-secrets][token]}}